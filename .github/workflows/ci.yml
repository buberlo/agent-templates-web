name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Fetch content repo
        run: npm run fetch-content
        env:
          CONTENT_REPO_URL: https://github.com/buberlo/agent-templates.git
          CONTENT_REPO_REF: main

      - name: Test
        run: npm test

      - name: Build CLI
        run: npm run cli:build

      - name: Test CLI
        run: npm run cli:test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com